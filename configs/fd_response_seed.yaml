project:
  name: clas12-forward-fm-step1
  seed: 20260822

data:
  parquet_glob: /Users/huan-hsintseng/Downloads/QuantumMC_Simulations/phase-space_parquet-Aug17-26/particle_responses/*.parquet
  # The split is a deterministic hash of the true composite event key.
  split_modulus: 10000
  train_boundary: 8000
  validation_boundary: 9000
  max_rows_per_species:
    train: 60000
    validation: 15000
    test: 15000
  selection:
    theta_max_deg: 33.0
    vz_min_cm: -5.5
    vz_max_cm: -0.5
    require_reciprocal_match: true
    reject_rec_pid_zero: true
    reject_beta_sentinel: true
    max_abs_delta_p_gev: 10.0

model:
  hidden_width: 128
  hidden_layers: 3
  pid_embedding_dim: 8
  mixture_components: 5
  dropout: 0.05

training:
  epochs: 12
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.00001
  pid_loss_weight: 0.20
  gradient_clip_norm: 5.0
  early_stopping_patience: 3
  num_workers: 0
  torch_threads: 4
  device: auto

output:
  run_dir: runs/fd_response_seed

