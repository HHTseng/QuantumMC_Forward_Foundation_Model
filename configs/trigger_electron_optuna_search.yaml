  learning_rate: 0.001    # SEARCHED: [5e-4, 3.5e-3], log
  weight_decay: 0.00001   # SEARCHED: [1e-6, 3e-4], log
  gradient_clip_norm: 5.0
  early_stopping_patience: 40
  lr_schedule: cosine     # SEARCHED: {none, cosine}
  lr_min_factor: 0.01
  num_workers: 0
  torch_threads: 8
  device: cuda:0
